name: Bug report
description: Report incorrect behavior or API parsing
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, API keys, private URLs, account IDs, or unredacted API responses.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: input
    id: sub2api
    attributes:
      label: Sub2API version or commit
    validations:
      required: true
  - type: dropdown
    id: account_type
    attributes:
      label: Account type
      options:
        - OAuth subscription
        - API key relay
        - Unknown
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: redacted_shape
    attributes:
      label: Redacted response shape
      description: Optional. Replace every identifier and secret with placeholders.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private addresses, and personal identifiers.
          required: true
