name: Feature request or relay adapter
description: Suggest a feature or a compatible upstream monitoring API
title: "[Request]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Request type
      options:
        - New relay adapter
        - Account list or routing control
        - Alerting or history
        - User interface
        - Other
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the workflow and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: api_shape
    attributes:
      label: Redacted API documentation or response shape
      description: Required for adapter requests. Never paste a real token or private URL.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private addresses, and personal identifiers.
          required: true
