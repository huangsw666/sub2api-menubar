name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate tag and package version
        run: |
          VERSION="$(python3 -c 'import runpy; print(runpy.run_path("scripts/installer.py")["VERSION"])')"
          test "v${VERSION}" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match package version v${VERSION}" >&2
            exit 1
          }

      - name: Build universal package
        run: ./scripts/build-release.sh

      - name: Verify package checksum
        working-directory: dist
        run: shasum -a 256 -c *.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.zip \
              dist/*.sha256 \
              --verify-tag \
              --title "Sub2API Menu Bar $GITHUB_REF_NAME" \
              --generate-notes
          fi
